<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Você me ama?</title>

<style>
body {
    background: linear-gradient(to bottom, #ffd1dc, #fff);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
}

.box {
    background: white;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#nao {
    position: absolute;
}
</style>
</head>

<body>

<div class="box">
    <h1>Você me ama?</h1>

    <a href="/amo">
        <button>amo</button>
    </a>

    <button id="nao">não amo</button>
</div>

<script>
const btnNao = document.getElementById("nao");

btnNao.addEventListener("mouseover", () => {
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;

    btnNao.style.left = x + "px";
    btnNao.style.top = y + "px";
});
</script>

</body>
</html>
