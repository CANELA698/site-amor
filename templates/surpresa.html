<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Minha surpresa 💖</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background: linear-gradient(to bottom, #fff, #ffd6e7);
    overflow-x:hidden;
}

/* PLAYER */
.player {
    text-align:center;
    margin:20px;
}

.play-btn {
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:#ff4d88;
    color:white;
    font-size:16px;
    cursor:pointer;
}

/* TEXTO */
.texto {
    max-width:700px;
    margin:50px auto;
    font-size:18px;
    line-height:1.8;
    text-align:center;
    min-height:200px;
}

/* POLAROIDS */
.galeria {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.polaroid {
    background:white;
    padding:10px;
    width:200px;
    margin:20px;
    transform: rotate(-5deg);
    opacity:0;
    transition: all 1s ease;
}

.polaroid.show {
    opacity:1;
    transform: rotate(0deg);
}

.polaroid img {
    width:100%;
}

/* CORAÇÕES */
.heart {
    position:fixed;
    bottom:-50px;
    font-size:20px;
    animation: subir 6s linear forwards;
    cursor:pointer;
}

@keyframes subir {
    from {transform: translateY(0);}
    to {transform: translateY(-120vh);}
}
</style>
</head>

<body>

<div class="player">
    <button class="play-btn" onclick="tocarMusica()">▶️ Tocar nossa música</button>
    <audio id="musica" src="/static/musica.mp3"></audio>
</div>

<div class="texto" id="texto"></div>

<div class="galeria" id="galeria">

    <!-- até 12 fotos -->
    <div class="polaroid"><img src="/static/fotos/foto1.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto2.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto3.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto4.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto5.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto6.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto7.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto8.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto9.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto10.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto11.jpg"></div>
    <div class="polaroid"><img src="/static/fotos/foto12.jpg"></div>

</div>

<script>

// 🎵 MUSICA
function tocarMusica(){
    document.getElementById("musica").play();
}

// ✍️ TEXTO CINEMATOGRÁFICO
const texto = `Eu também te amo meu amor 💖...

Eu te amo minha LUANA, minha lua 🌙...

Minha atual namorada, em breve noiva e futuramente esposa...

Já são mais de 5 ANOS vivendo tudo isso juntos...

E eu faria isso mil vezes só pra ver você sorrir...

Cada momento com você é especial...

E essa é só uma pequena forma de mostrar o quanto eu te amo...

Eu amo MUITO você 💘`;

let i = 0;
function escrever(){
    if(i < texto.length){
        document.getElementById("texto").innerHTML += texto.charAt(i);
        i++;
        setTimeout(escrever, 35);
    }
}

escrever();

// 📸 ANIMAÇÃO DAS FOTOS
const fotos = document.querySelectorAll(".polaroid");

window.addEventListener("scroll", () => {
    fotos.forEach(f => {
        const pos = f.getBoundingClientRect().top;
        if(pos < window.innerHeight - 100){
            f.classList.add("show");
        }
    });
});

// 💖 CORAÇÕES INTERATIVOS
function criarCoracao(){
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random()*100+"vw";

    h.onclick = () => {
        for(let i=0;i<5;i++){
            let mini = document.createElement("div");
            mini.innerHTML = "💗";
            mini.style.position="fixed";
            mini.style.left = h.style.left;
            mini.style.bottom = "50px";
            document.body.appendChild(mini);

            setTimeout(()=>mini.remove(),1000);
        }
        h.remove();
    }

    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
}

setInterval(criarCoracao, 1200);

</script>

</body>
</html>
